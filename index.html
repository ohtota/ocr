<!doctype html>
<html lang="ja-JP">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>OCR Web App</title>
    <!--
    <link rel="icon" href="favicon.ico">
    <style></style>
    <script></script>
    -->
  </head>
  <body>
    <h1>■OCR Web App(2026-07-02 16:17)</h1>
    <div>
      カメラの選択：
      <select id="cameraSelect"></select>
    </div>
    <div>
      <video id="camera" autoplay muted playsinline width="320"></video>
    </div>
    <div>
      <button id="send">読み取り</button>
    </div>
    <p id="status">カメラ起動中。。。</p>
    <pre id="result"></pre>

    <script>
      // const $ = (id) => document.getElementById(id);
      const $ = (selector) => document.querySelector(selector);
      // const videoWidth = 842;   // 842x1191: A版用紙縦
      // const videoHeight = 1191;
      const videoWidth = 640;
      const videoHeight = 480;
      let currentStream = null;
      $("#send").onclick = captureAndSend;
      // $("#send").onclick = ocr;
      // startCamera();
      init();

      async function init() {
        try {
          const initialStream = await navigator.mediaDevices.getUserMedia({
            video: {
              width: {ideal: videoWidth },
              height: {ideal: videoHeight },
            }
          });
          initialStream.getTracks().forEach(track => track.stop());
        } catch (err) {
          $("#status").textContent = "エラー😭： " + err.name + " - " + err.message;
          return
        }
        try {
          // await navigator.mediaDevices.getUserMedia({ video: true});
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(device => device.kind === "videoinput");
          const select = $("#cameraSelect");
          videoDevices.forEach((device, i) => {
            const optin = document.createElement("option");
            optin.value = device.deviceId;
            optin.text = device.label || `カメラ ${i + 1}`;
            select.appendChild(optin);
          });
          await startCamera(videoDevices[0].deviceId); // 初期起動
          select.onchange = () => startCamera(select.value);
        } catch (err) {
          $("#status").textContent = "エラー😭： " + err.name + " - " + err.message;
        }
      }

      async function startCamera(deviceId) {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { 
              deviceId: { exact: deviceId },
              width: {ideal: videoWidth },
              height: {ideal: videoHeight },
            }
          });
          $("#camera").srcObject = stream;
          currentStream = stream;
          const videoTrack = stream.getVideoTracks()[0];
          const settings = videoTrack.getSettings();

        const res = await fetch("https://my-hono-app.ohtota.workers.dev/key");
        const key = await res.text();

          $("#status").textContent = `${key} カメラ起動成功😄： ${settings.width}x${settings.height}px`;
        } catch (err) {
          $("#status").textContent = `エラー😭： ${err.name} - ${err.message}`;
        }

        /*
        const status = document.getElementById("status");
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment"} // アウトカメラを指定
          });
          document.getElementById("camera").srcObject = stream;
          status.textContent = "カメラ起動成功😄";
        } catch (err) {
          console.error("カメラエラー：", err.name, err.message);
          status.textContent = "エラー😭： " + err.name + " - " + err.message;
        }
        */
      }

      async function captureAndSend() {
        const video = $("#camera");
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);
        const blob = await new Promise(
          resolve => canvas.toBlob(resolve, "image/jpeg")
        );
        const formData = new FormData();
        formData.append("file", blob, "capture.jpg");
        const res = await fetch(" https://base64.ohtota.workers.dev/ocr", {
        // const res = await fetch("https://sample-api.ohtota.workers.dev/file", {
          method: "POST",
          body: formData,
        });
        const data = await res.text();
        $("#status").textContent = data;
        // alert(data);
      }

      async function ocr() {
        const video = $("#camera");
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);
        const blob = await new Promise(
          resolve => canvas.toBlob(resolve, "image/jpeg")
        );
        const base64 = await fileToBase64(blob);

        const res = await fetch("https://my-hono-app.ohtota.workers.dev/key");
        const key = await res.text();

        const response = await fetch(
          "https://api.openai.com/v1/responses",
          {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${key}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              model: "gpt-4.1-mini",
              // model: "gtp-4o",
              input: [
                {
                  role: "user",
                  content: [
                    {
                      type: "input_text",
                      text: "画像内の文字を抽出してください。",
                    },
                    {
                      type: "input_image",
                      image_url: base64,
                    },
                  ],
                },
              ],
            }), // JSON.stringifyの閉じカッコ
          }
        ); // fetchの閉じカッコ

        console.log(response.status);
        const json = await response.json();
        console.log(json);

        $("#result").textContent = json.output[0].content[0].text;
      }

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

    </script>  
  </body>
</html>
