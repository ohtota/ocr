<!doctype html>
<html lang="ja-JP">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>OCR Web App</title>
    <!--
    <link rel="icon" href="favicon.ico">
    <style></style>
    <script></script>
    -->
  </head>
  <body>
    <h1>■OCR Web App</h1>
    <select id="cameraSelect"></select>
    <video id="camera" autoplay muted playsinline width="300"></video>
    <button id="send">読み取り</button>
    <p id="status">カメラ起動中。。。</p>
    <script>
      // const $ = (id) => document.getElementById(id);
      const $ = (selector) => document.querySelector(selector);
      let currentStream = null;
      $("#send").onclick = captureAndSend;
      // startCamera();
      init();

      async function init() {
        try {
          await navigator.mediaDevices.getUserMedia({ video: true});
        } catch (err) {
          $("#status").textContent = "エラー😭： " + err.name + " - " + err.message;
          return
        }
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === "videoinput");
        const select = $("#cameraSelect");
        videoDevices.forEach((device, i) => {
          const optin = document.createElement("#option");
          optin.value = device.deviceId;
          optin.text = device.label || `カメラ ${i + 1}`;
          select.appendChild(optin);
        });
        startCamera(videoDevices[0].deviceId); // 初期起動
        select.onchange = () => startCamera(select.value);
      }

      async function startCamera(deviceId) {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: deviceId} }
        });
        $("#camera").srcObject = stream;
        currentStream = stream;

        /*
        const status = document.getElementById("status");
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment"} // アウトカメラを指定
          });
          document.getElementById("camera").srcObject = stream;
          status.textContent = "カメラ起動成功😄";
        } catch (err) {
          console.error("カメラエラー：", err.name, err.message);
          status.textContent = "エラー😭： " + err.name + " - " + err.message;
        }
        */
      }

      async function captureAndSend() {
        const video = $("#camera");
        const canvas = $("#canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoWidth;
        canvas.getContext("2d").drawImage(video, 0, 0);
        const blob = await new Promise(
          resolve => canvas.toBlob(resolve, "image/jpeg")
        );
        const formData = new FormData();
        formData.append("file", blob, "capture.jpg");
        const res = await fetch("https://sample-api.ohtota.workers.dev/file", {
          method: "POST",
          body: formData,
        });
        const data = await res.json();
        alert(data);
      }
    </script>  
  </body>
</html>
